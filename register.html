<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduPionir - Daftar Akun</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <section>
        <header>
            <h1 class="brand-name">EduPionir</h1>
            <h3>Buat Akun Baru</h3>
            <p>Bergabung dengan ribuan teman lainnya!</p>
        </header>

        <main>
            <form action="index.html">
                <input type="text" placeholder="Nama Lengkap" required>
                <input type="email" placeholder="Email Aktif" required>
                <input type="password" placeholder="Buat Password" required>
                <input type="password" placeholder="Ulangi Password" required>
                <button type="submit" style="background-color: #fee440; color: #2b2d42;">Daftar Sekarang</button>
            </form>
            <p style="margin-top: 20px;">Sudah ada akun? <a href="index.html">Login saja</a></p>
        </main>
    </section>

    <script src="assets/js/script.js"></script>
</body>
</html>
